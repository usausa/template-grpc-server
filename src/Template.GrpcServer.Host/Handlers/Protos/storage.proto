syntax = "proto3";

option csharp_namespace = "Template.GrpcServer.Host";

package storage;

// The storage service definition.
service Storage {
  // Client streaming (metadata first, then chunks)
  rpc Upload (stream UploadRequest) returns (UploadReply);
  // Server streaming (metadata first, then chunks)
  rpc Download (DownloadRequest) returns (stream DownloadReply);
}

message FileMetadata {
  string name = 1;
  int64 size = 2;
}

message UploadRequest {
  oneof payload {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}

message UploadReply {
  string name = 1;
  int64 size = 2;
}

message DownloadRequest {
  string name = 1;
}

message DownloadReply {
  oneof payload {
    FileMetadata metadata = 1;
    bytes chunk = 2;
  }
}
