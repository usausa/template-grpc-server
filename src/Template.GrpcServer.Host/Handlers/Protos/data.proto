syntax = "proto3";

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Template.GrpcServer.Host";

package data.v1;

// The data service definition.
service Data {
  // Unary
  rpc GetData (GetDataRequest) returns (DataItem);
  rpc BatchGetData (BatchGetDataRequest) returns (BatchGetDataReply);
  rpc SetData (SetDataRequest) returns (SetDataReply);
  rpc DeleteData (DeleteDataRequest) returns (DeleteDataReply);
  rpc ListData (ListDataRequest) returns (ListDataReply);
  // Server streaming
  rpc ExportData (ExportDataRequest) returns (stream DataItem);
  // Client streaming
  rpc UploadData (stream SetDataRequest) returns (UploadDataReply);
  // Bidirectional streaming
  rpc Chat (stream ChatMessage) returns (stream ChatMessage);
  // Bidirectional streaming (server driven)
  rpc Notify (stream ClientMessage) returns (stream ServerMessage);
}

message GetDataRequest {
  int64 id = 1;
}

message BatchGetDataRequest {
  // 1 to 100 ids. Duplicates are allowed.
  repeated int64 ids = 1;
}

message BatchGetDataReply {
  // In the same order as the request.
  repeated DataItem items = 1;
}

message DataItem {
  int64 id = 1;
  string name = 2;
  int32 value = 3;
  google.protobuf.Timestamp created_at = 4;
  DataStatus status = 5;
  // At most 16 labels. Keys are 1 to 63 characters, values are up to 63 characters.
  map<string, string> labels = 6;
}

message SetDataRequest {
  string name = 1;
  int32 value = 2;
  // Unspecified means active.
  DataStatus status = 3;
  map<string, string> labels = 4;
}

message SetDataReply {
  int64 id = 1;
}

message DeleteDataRequest {
  int64 id = 1;
}

message DeleteDataReply {
  bool deleted = 1;
}

message ListDataRequest {
  string name = 1;
  // Sort column (Id / Name / Value / CreatedAt). Empty means Id.
  string sort = 2;
  bool desc = 3;
  // Created at or after.
  google.protobuf.Timestamp created_from = 4;
  // Created before.
  google.protobuf.Timestamp created_to = 5;
  // 0 means 20. Values above 100 are coerced to 100.
  int32 page_size = 6;
  // next_page_token of the previous page. Other fields except page_size must not change.
  string page_token = 7;
  // Unspecified means any.
  DataStatus status = 8;
}

message ListDataReply {
  repeated DataItem items = 1;
  // Empty at the end of the collection.
  string next_page_token = 2;
  int32 total_size = 3;
}

message ExportDataRequest {
  string name = 1;
  // Sort column (Id / Name / Value / CreatedAt). Empty means Id.
  string sort = 2;
  bool desc = 3;
  // Created at or after.
  google.protobuf.Timestamp created_from = 4;
  // Created before.
  google.protobuf.Timestamp created_to = 5;
  // Unspecified means any.
  DataStatus status = 6;
}

message UploadDataReply {
  // Number of inserted items.
  int32 count = 1;
  // Items that were not inserted (validation or duplicate), identified by their position in the stream.
  repeated UploadFailure failures = 2;
}

message UploadFailure {
  int32 index = 1;
  string name = 2;
  string reason = 3;
}

message ChatMessage {
  string name = 1;
  string message = 2;
}

message ClientMessage {
  oneof payload {
    JoinRequest join = 1;
    BroadcastRequest broadcast = 2;
  }
}

message JoinRequest {
  string name = 1;
}

message BroadcastRequest {
  string message = 1;
}

message ServerMessage {
  oneof payload {
    Tick tick = 1;
    Broadcast broadcast = 2;
  }
}

message Tick {
  google.protobuf.Timestamp time = 1;
  int32 subscribers = 2;
}

message Broadcast {
  string name = 1;
  string message = 2;
}

// Status of DataItem. Set by the client.
enum DataStatus {
  DATA_STATUS_UNSPECIFIED = 0;
  DATA_STATUS_ACTIVE = 1;
  DATA_STATUS_INACTIVE = 2;
}
